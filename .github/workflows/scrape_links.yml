name: Daily Match Scraper

on:
  schedule:
    # Runs at 15:00 UTC every day, which is 00:00 AM JST
    - cron: '0 15 * * *'
  workflow_dispatch: # Allows you to run it manually via the 'Actions' tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run the scraper script
        run: python scraper.py

      - name: Commit and Push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add links.txt
          # Only commit if the file actually changed
          git commit -m "Update matches for JST $(date)" || echo "No changes to commit"
          git push
