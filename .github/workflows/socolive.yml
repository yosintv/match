name: Socolive Scraper

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Selenium and WebDriver
        run: |
          pip install selenium webdriver-manager
          
      - name: Run Socolive Scraper
        run: python socolive.py

      - name: Commit and Push
        run: |
          git config --global user.name "Socolive Bot"
          git config --global user.email "bot@socolive.local"
          git add socolive_links.txt
          git commit -m "Update match links: $(date)" || exit 0
          git push
