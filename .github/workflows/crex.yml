name: Update CREX Schedule

on:
  schedule:
    # This runs the scraper every 3 hours automatically
    - cron: '0 */3 * * *'
  workflow_dispatch: # This allows you to run it manually from the "Actions" tab

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: Allows the bot to save matches.json to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # curl_cffi is needed for browser impersonation (prevents 0 matches)
          # beautifulsoup4 is used to parse the HTML/JSON data
          pip install curl_cffi beautifulsoup4

      - name: Run CREX Scraper
        run: python crex.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the updated JSON file
          git add matches.json
          
          # Only commit if the file actually changed to prevent workflow errors
          if git diff --staged --quiet; then
            echo "No changes detected in match data."
          else
            git commit -m "Automated update: Cricket Matches $(date)"
            git push
          fi
